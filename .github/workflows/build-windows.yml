name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --windowed --name Libris --collect-all customtkinter --collect-all barcode main.py
      - name: Check output
        run: if (-not (Test-Path dist/Libris/Libris.exe)) { throw "Libris.exe tidak ditemukan" }
      - uses: actions/upload-artifact@v4
        with:
          name: Libris-windows
          path: dist/Libris/
          if-no-files-found: error
